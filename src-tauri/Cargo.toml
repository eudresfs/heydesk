[package]
name = "heydesk"
version = "0.4.3"
description = "Shell local de desktop do Heydesk"
authors = ["Heydesk contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "heydesk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = "0.4"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false }
tauri-plugin-drag = "=2.1.1"
tauri-plugin-global-shortcut = "=2.2.0"
tauri-plugin-updater = "=2.14.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Media_Control", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Storage", "Storage_FileProperties", "Storage_Streams", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Foundation_Collections", "Networking_Connectivity", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Input_KeyboardAndMouse"] }

# Instalador: binário menor e mais rápido.
[profile.release]
lto = true
codegen-units = 1
strip = true
